<!DOCTYPE html>
<html lang="id" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MHA Workspace - Mahasiswa Fisika & Aktivis</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        brand: { 50: '#f0fdfa', 500: '#14b8a6', 600: '#0d9488', 900: '#134e4a' }
                    }
                }
            }
        }
    </script>
    <style>
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .dark ::-webkit-scrollbar-thumb { background: #475569; }
        body { transition: background-color 0.3s ease, color 0.3s ease; }
        .fade-in { animation: fadeIn 0.4s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .prose p { margin-bottom: 0.75em; }
        .prose ul { list-style-type: disc; padding-left: 1.5em; margin-bottom: 1em; }
        .prose strong { font-weight: 600; color: inherit; }
    </style>
</head>
<body class="bg-[#F8FAFC] dark:bg-[#090E17] text-gray-900 dark:text-gray-100 flex h-screen overflow-hidden selection:bg-brand-500/30">

    <!-- Sidebar -->
    <aside id="sidebar" class="fixed inset-y-0 left-0 z-50 w-72 bg-white dark:bg-[#111827] border-r border-gray-200 dark:border-slate-800/60 transform -translate-x-full md:translate-x-0 md:static flex flex-col shadow-2xl md:shadow-none transition-transform duration-300">
        <div class="p-6 md:p-8 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-brand-500 to-indigo-600 flex items-center justify-center text-white font-black text-xl shadow-lg shadow-brand-500/20">M</div>
                <div>
                    <h1 class="font-bold text-lg tracking-tight leading-tight">Aditya Dwi</h1>
                    <p class="text-[10px] font-bold text-gray-500 dark:text-gray-400 uppercase tracking-widest">Workspace</p>
                </div>
            </div>
            <button onclick="toggleMobileMenu()" class="md:hidden p-2 bg-gray-100 dark:bg-slate-800 rounded-lg text-gray-500">
                <i data-lucide="x" class="w-5 h-5"></i>
            </button>
        </div>
        <nav id="nav-menu" class="flex-1 px-4 md:px-6 space-y-1.5 overflow-y-auto"></nav>
        <div class="p-6 border-t border-gray-100 dark:border-slate-800/60 mt-auto">
            <button onclick="toggleDarkMode()" class="w-full flex items-center justify-center gap-2 px-4 py-3 text-sm font-bold text-gray-700 dark:text-gray-300 bg-gray-100 dark:bg-slate-800/80 rounded-xl hover:bg-gray-200 dark:hover:bg-slate-700 transition-colors">
                <i data-lucide="sun" id="theme-icon" class="w-4 h-4"></i>
                <span id="theme-text">Mode Terang</span>
            </button>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 flex flex-col min-w-0 relative">
        <header class="md:hidden flex items-center justify-between p-4 bg-white/80 dark:bg-[#111827]/80 backdrop-blur-md border-b border-gray-200 dark:border-slate-800/60 sticky top-0 z-30">
            <div class="flex items-center gap-3">
                <button onclick="toggleMobileMenu()" class="p-2 bg-gray-100 dark:bg-slate-800 rounded-lg text-gray-600 dark:text-gray-400">
                    <i data-lucide="menu" class="w-5 h-5"></i>
                </button>
                <h2 id="mobile-header-title" class="font-bold text-lg">Dashboard</h2>
            </div>
        </header>

        <header class="hidden md:flex items-center justify-between px-10 py-8 max-w-7xl mx-auto w-full">
            <div>
                <h2 id="desktop-header-title" class="text-3xl font-black tracking-tight">Dashboard</h2>
                <p id="desktop-header-desc" class="text-sm font-medium text-gray-500 dark:text-gray-400 mt-1.5">Ringkasan agenda prioritas dan jadwal harian Anda.</p>
            </div>
            <div class="flex items-center gap-3 bg-white dark:bg-[#111827] px-4 py-2 rounded-full border border-gray-200 dark:border-slate-800/60 shadow-sm">
                <div class="w-8 h-8 rounded-full bg-slate-200 dark:bg-slate-700 flex items-center justify-center text-slate-600 dark:text-slate-300 font-bold text-xs">
                    <i data-lucide="user" class="w-4 h-4"></i>
                </div>
                <span class="text-sm font-bold text-gray-700 dark:text-gray-300 pr-2">Mahasiswa Fisika</span>
            </div>
        </header>

        <!-- Area Konten Utama -->
        <div id="workspace" class="flex-1 overflow-y-auto px-4 md:px-10 pb-10 max-w-7xl mx-auto w-full flex flex-col">
            <!-- Injected via JS -->
        </div>
    </main>

    <div id="mobile-overlay" onclick="toggleMobileMenu()" class="fixed inset-0 bg-slate-900/50 dark:bg-black/60 z-40 hidden backdrop-blur-sm transition-opacity"></div>

    <script>
        // ==========================================
        // 1. KONFIGURASI API & DATA
        // ==========================================
        const GEMINI_API_KEY = ""; // PASTE API KEY ANDA DI SINI

        const CATEGORIES = {
            DASHBOARD: 'Dashboard',
            FISIKA: 'Fisika',
            KOPMA: 'Kopma',
            BEM: 'BEM Univ',
            PMII: 'PMII Rayon'
        };

        const MENU_ITEMS = [
            { id: CATEGORIES.DASHBOARD, label: 'Dashboard Pribadi', icon: 'home' },
            { id: CATEGORIES.FISIKA, label: 'Sebagai Mahasiswa', icon: 'book-open' },
            { id: CATEGORIES.KOPMA, label: 'Kopma', icon: 'users' },
            { id: CATEGORIES.BEM, label: 'BEM Universitas', icon: 'landmark' },
            { id: CATEGORIES.PMII, label: 'Ibnu Sina', icon: 'flag' },
        ];

        // State Aplikasi (Penyimpanan memori lokal)
        let state = {
            activeTab: CATEGORIES.DASHBOARD,
            activeSub: null, // Menyimpan Sub-Kategori (Proker/Matkul) yang aktif
            isDark: true,
            isMobileMenuOpen: false,
            
            // Database
            subCategories: JSON.parse(localStorage.getItem('mha_subcats')) || {
                [CATEGORIES.FISIKA]: ['Fisika Dasar', 'Mekanika Kuantum'],
                [CATEGORIES.KOPMA]: ['Bazar Mahasiswa', 'Rapat Rutin'],
                [CATEGORIES.BEM]: ['Penerimaan Maba', 'Kajian Isu'],
                [CATEGORIES.PMII]: ['Mapaba', 'Kajian Keislaman']
            },
            tasks: JSON.parse(localStorage.getItem('mha_tasks_v2')) || [], // Format baru ada subCategory
            notesList: JSON.parse(localStorage.getItem('mha_notes_list')) || [], // Format array of objects
            
            // View States
            calendarView: 'mingguan',
            aiImageBase64: null,
            editingNoteId: null // Jika null berarti nampilin list, jika isi berarti form edit/tambah
        };

        // ==========================================
        // 2. FUNGSI PENYIMPANAN
        // ==========================================
        function saveData() {
            localStorage.setItem('mha_subcats', JSON.stringify(state.subCategories));
            localStorage.setItem('mha_tasks_v2', JSON.stringify(state.tasks));
            localStorage.setItem('mha_notes_list', JSON.stringify(state.notesList));
        }

        // --- MANAJEMEN TUGAS ---
        function addTask(title, dueDate) {
            if(!title.trim() || !state.activeSub) return;
            state.tasks.push({
                id: Date.now().toString(),
                title, dueDate, 
                category: state.activeTab, 
                subCategory: state.activeSub,
                isDone: false
            });
            saveData();
            renderWorkspace();
        }
        function toggleTask(id) {
            state.tasks = state.tasks.map(t => t.id === id ? { ...t, isDone: !t.isDone } : t);
            saveData();
            renderWorkspace();
        }
        function deleteTask(id) {
            state.tasks = state.tasks.filter(t => t.id !== id);
            saveData();
            renderWorkspace();
        }

        // --- MANAJEMEN NOTULENSI ---
        function openNewNoteForm() {
            state.editingNoteId = 'new';
            renderWorkspace();
        }
        function editNote(id) {
            state.editingNoteId = id;
            renderWorkspace();
        }
        function closeNoteForm() {
            state.editingNoteId = null;
            renderWorkspace();
        }
        function saveNoteForm(event) {
            event.preventDefault();
            const title = document.getElementById('note-title').value;
            const date = document.getElementById('note-date').value;
            const content = document.getElementById('note-content').value;

            if(state.editingNoteId === 'new') {
                state.notesList.push({
                    id: Date.now().toString(),
                    title, date, content,
                    category: state.activeTab,
                    subCategory: state.activeSub
                });
            } else {
                state.notesList = state.notesList.map(n => 
                    n.id === state.editingNoteId ? { ...n, title, date, content } : n
                );
            }
            saveData();
            closeNoteForm();
        }
        function deleteNoteItem(id) {
            if(confirm('Yakin ingin menghapus notulensi ini?')) {
                state.notesList = state.notesList.filter(n => n.id !== id);
                saveData();
                renderWorkspace();
            }
        }

        // --- MANAJEMEN SUB KATEGORI ---
        function addSubCategory() {
            let noun = state.activeTab === CATEGORIES.FISIKA ? 'Mata Kuliah' : 'Program Kerja / Divisi';
            const name = prompt(`Masukkan nama ${noun} baru:`);
            if(name && name.trim() !== '') {
                if(!state.subCategories[state.activeTab]) {
                    state.subCategories[state.activeTab] = [];
                }
                if(!state.subCategories[state.activeTab].includes(name.trim())) {
                    state.subCategories[state.activeTab].push(name.trim());
                }
                state.activeSub = name.trim();
                state.editingNoteId = null;
                saveData();
                renderWorkspace();
            }
        }
        function selectSubCategory(subName) {
            state.activeSub = subName;
            state.editingNoteId = null; // Tutup form note kalau lagi pindah sub
            renderWorkspace();
        }

        // ==========================================
        // 3. KONTROL UI TEMA & MENU
        // ==========================================
        function toggleMobileMenu() {
            state.isMobileMenuOpen = !state.isMobileMenuOpen;
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('mobile-overlay');
            if (state.isMobileMenuOpen) {
                sidebar.classList.remove('-translate-x-full');
                overlay.classList.remove('hidden');
            } else {
                sidebar.classList.add('-translate-x-full');
                overlay.classList.add('hidden');
            }
        }

        function toggleDarkMode() {
            state.isDark = !state.isDark;
            const html = document.documentElement;
            if (state.isDark) {
                html.classList.add('dark');
                document.getElementById('theme-icon').setAttribute('data-lucide', 'sun');
                document.getElementById('theme-text').textContent = 'Mode Terang';
            } else {
                html.classList.remove('dark');
                document.getElementById('theme-icon').setAttribute('data-lucide', 'moon');
                document.getElementById('theme-text').textContent = 'Mode Gelap';
            }
            lucide.createIcons();
        }

        function switchTab(tabId) {
            state.activeTab = tabId;
            // Set sub-kategori aktif otomatis ke index pertama jika ada
            if(tabId !== CATEGORIES.DASHBOARD) {
                const subs = state.subCategories[tabId] || [];
                state.activeSub = subs.length > 0 ? subs[0] : null;
            } else {
                state.activeSub = null;
            }
            state.editingNoteId = null;

            if (state.isMobileMenuOpen) toggleMobileMenu();
            renderNavigation();
            renderHeader();
            renderWorkspace();
        }
        function switchCalendarView(view) {
            state.calendarView = view;
            renderWorkspace();
        }

        // ==========================================
        // 4. RENDERING KOMPONEN
        // ==========================================
        function renderNavigation() {
            document.getElementById('nav-menu').innerHTML = MENU_ITEMS.map(item => `
                <button onclick="switchTab('${item.id}')"
                    class="w-full flex items-center gap-3.5 px-4 py-3.5 text-sm font-semibold rounded-2xl transition-all ${
                        state.activeTab === item.id 
                            ? 'bg-brand-50 text-brand-700 dark:bg-brand-500/10 dark:text-brand-400 shadow-sm' 
                            : 'text-gray-600 hover:bg-gray-50 hover:text-gray-900 dark:text-gray-400 dark:hover:bg-slate-800/40 dark:hover:text-gray-200'
                    }">
                    <i data-lucide="${item.icon}" class="w-5 h-5"></i>
                    ${item.label}
                </button>
            `).join('');
            lucide.createIcons();
        }

        function renderHeader() {
            document.getElementById('mobile-header-title').textContent = state.activeTab;
            document.getElementById('desktop-header-title').textContent = state.activeTab;
            let desc = "";
            if(state.activeTab === CATEGORIES.DASHBOARD) desc = "Ringkasan agenda prioritas dan jadwal harian Anda.";
            else if(state.activeTab === CATEGORIES.FISIKA) desc = "Fokus pada perkuliahan, tugas spesifik matkul, dan bantuan AI.";
            else desc = `Fokus pencapaian program kerja dan manajemen arsip ${state.activeTab}.`;
            document.getElementById('desktop-header-desc').textContent = desc;
        }

        // --- KOMPONEN SUB KATEGORI (PILLS) ---
        function renderSubCategoriesPills() {
            const subs = state.subCategories[state.activeTab] || [];
            let html = `
                <div class="flex items-center gap-2 mb-6 overflow-x-auto pb-2 custom-scrollbar shrink-0 fade-in">
            `;
            subs.forEach(sub => {
                const isActive = state.activeSub === sub;
                html += `
                    <button onclick="selectSubCategory('${sub}')" 
                        class="px-5 py-2 rounded-xl text-sm font-bold whitespace-nowrap transition-all border ${
                        isActive 
                        ? 'bg-indigo-600 text-white border-indigo-600 shadow-md shadow-indigo-500/20' 
                        : 'bg-white dark:bg-slate-800 text-gray-600 dark:text-gray-300 border-gray-200 dark:border-slate-700 hover:bg-gray-50 dark:hover:bg-slate-700'
                    }">${sub}</button>
                `;
            });
            html += `
                <button onclick="addSubCategory()" class="px-4 py-2 rounded-xl text-sm font-bold whitespace-nowrap border-2 border-dashed border-gray-300 dark:border-slate-600 text-gray-500 hover:text-indigo-600 hover:border-indigo-400 transition-colors flex items-center">
                    <i data-lucide="plus" class="w-4 h-4 mr-1"></i> Tambah
                </button>
                </div>
            `;
            return html;
        }

        // --- KOMPONEN TUGAS ---
        function handleTaskSubmit(event) {
            event.preventDefault();
            const title = document.getElementById('task-title').value;
            const date = document.getElementById('task-date').value;
            addTask(title, date);
        }

        function renderTaskList() {
            // Filter tugas berdasarkan Kategori DAN Sub-Kategori yang sedang aktif
            const filteredTasks = state.tasks.filter(t => t.category === state.activeTab && t.subCategory === state.activeSub);

            if (filteredTasks.length === 0) {
                return `
                    <div class="h-full min-h-[150px] flex flex-col items-center justify-center text-gray-400">
                        <i data-lucide="check-circle-2" class="w-8 h-8 mb-2 opacity-20"></i>
                        <p class="text-sm">Belum ada tugas untuk ${state.activeSub || 'ini'}.</p>
                    </div>
                `;
            }

            return filteredTasks.sort((a,b) => a.isDone - b.isDone).map(task => `
                <div class="flex items-start p-3 mb-2 rounded-xl border transition-all duration-200 ${
                    task.isDone ? 'bg-gray-50/50 dark:bg-slate-800/30 border-transparent dark:border-transparent opacity-50' : 'bg-white dark:bg-slate-800 border-gray-100 dark:border-slate-700 shadow-sm'
                }">
                    <button onclick="toggleTask('${task.id}')" class="mt-0.5 mr-3 text-gray-400 hover:text-brand-500 transition-colors shrink-0">
                        <i data-lucide="${task.isDone ? 'check-circle' : 'circle'}" class="w-5 h-5 ${task.isDone ? 'text-brand-500' : ''}"></i>
                    </button>
                    <div class="flex-1 ${task.isDone ? 'line-through' : ''}">
                        <p class="text-sm font-medium text-gray-800 dark:text-gray-100 leading-tight">${task.title}</p>
                        ${task.dueDate ? `
                            <p class="text-[11px] text-gray-500 dark:text-gray-400 mt-1.5 flex items-center font-medium uppercase tracking-wide">
                                <i data-lucide="calendar" class="w-3 h-3 mr-1"></i>
                                ${new Date(task.dueDate).toLocaleDateString('id-ID', { weekday: 'short', day: 'numeric', month: 'short' })}
                            </p>
                        ` : ''}
                    </div>
                    <button onclick="deleteTask('${task.id}')" class="ml-2 p-1.5 text-gray-400 hover:text-rose-500 hover:bg-rose-50 dark:hover:bg-rose-500/10 rounded-lg transition-colors shrink-0">
                        <i data-lucide="trash-2" class="w-4 h-4"></i>
                    </button>
                </div>
            `).join('');
        }

        // ==========================================
        // 5. HALAMAN SPESIFIK
        // ==========================================
        
        function renderDashboard() {
            const today = new Date();
            today.setHours(0,0,0,0);
            const next3Days = new Date(today);
            next3Days.setDate(today.getDate() + 3);

            const urgentTasks = state.tasks.filter(t => {
                if (t.isDone || !t.dueDate) return false;
                const due = new Date(t.dueDate);
                due.setHours(0,0,0,0);
                return due <= next3Days;
            }).sort((a, b) => new Date(a.dueDate) - new Date(b.dueDate));

            let urgentHtml = urgentTasks.length === 0 
                ? `<p class="text-sm font-medium text-rose-600/70 dark:text-rose-400/70">Aman cuy gak ada deadline.</p>`
                : urgentTasks.map(task => `
                    <div class="bg-white/90 dark:bg-slate-900/90 p-4 rounded-xl shadow-sm border border-rose-100/50 dark:border-rose-900/30">
                        <div class="flex flex-wrap items-center gap-2 mb-2">
                            <span class="text-[9px] font-black uppercase tracking-wider px-2 py-1 rounded-md bg-gray-100 dark:bg-slate-800 text-gray-600 dark:text-gray-300">${task.category}</span>
                            <span class="text-[9px] font-bold px-2 py-1 rounded-md border border-gray-200 dark:border-slate-700 text-gray-500 dark:text-gray-400 truncate max-w-[100px]">${task.subCategory || '-'}</span>
                        </div>
                        <p class="text-sm text-gray-800 dark:text-gray-200 font-semibold truncate mb-2">${task.title}</p>
                        <span class="text-xs font-bold text-rose-600 dark:text-rose-400 flex items-center"><i data-lucide="clock" class="w-3 h-3 mr-1"></i> ${new Date(task.dueDate).toLocaleDateString('id-ID', {day: 'numeric', month: 'short'})}</span>
                    </div>
                `).join('');

            let calendarHtml = '';
            const numDays = state.calendarView === 'mingguan' ? 7 : 28;
            for (let i = 0; i < numDays; i++) {
                const date = new Date(today);
                date.setDate(today.getDate() + i);
                const dateString = date.toISOString().split('T')[0];
                const dayTasks = state.tasks.filter(t => t.dueDate === dateString && !t.isDone);
                
                const isToday = i === 0;
                calendarHtml += `
                    <div class="p-3 rounded-xl border flex flex-col ${isToday ? 'bg-brand-50 dark:bg-brand-900/10 border-brand-200 dark:border-brand-800/50 shadow-sm' : 'bg-white dark:bg-slate-800/40 border-gray-100 dark:border-slate-700/50'}">
                        <div class="text-[11px] font-bold mb-3 flex items-center justify-between ${isToday ? 'text-brand-700 dark:text-brand-400' : 'text-gray-500 dark:text-gray-400'}">
                            <span>${date.toLocaleDateString('id-ID', { weekday: 'short', day: 'numeric', month: 'short' })}</span>
                            ${isToday ? '<span class="px-1.5 py-0.5 bg-brand-100 dark:bg-brand-800/50 rounded text-[9px] uppercase">Hari Ini</span>' : ''}
                        </div>
                        <div class="space-y-1.5 flex-1">
                            ${dayTasks.map(t => `
                                <div class="text-[10px] px-2 py-1.5 bg-gray-50 dark:bg-slate-900 rounded-md text-gray-700 dark:text-gray-300 truncate border-l-2 border-indigo-500 font-medium" title="[${t.subCategory}]${t.title}">
                                    ${t.title}
                                </div>
                            `).join('')}
                            ${dayTasks.length === 0 ? '<div class="text-[10px] text-gray-300 dark:text-gray-600 italic">Kosong</div>' : ''}
                        </div>
                    </div>
                `;
            }

            return `
                <div class="flex flex-col gap-6 h-full fade-in">
                    <div class="bg-gradient-to-br from-rose-50 to-orange-50 dark:from-rose-950/20 dark:to-orange-950/20 rounded-2xl border border-rose-100 dark:border-rose-900/30 p-5 md:p-6 shrink-0">
                        <h3 class="text-base md:text-lg font-bold mb-4 text-rose-700 dark:text-rose-400 flex items-center"><i data-lucide="alert-triangle" class="w-5 h-5 mr-2"></i> TUGAS URGENT (Deadline H-3)</h3>
                        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4">${urgentHtml}</div>
                    </div>
                    <div class="bg-white dark:bg-slate-800/50 rounded-2xl border border-gray-100 dark:border-slate-700/50 p-5 md:p-6 flex-1 flex flex-col min-h-[400px]">
                        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-6 gap-4">
                            <h3 class="text-base md:text-lg font-bold text-gray-800 dark:text-white flex items-center"><i data-lucide="calendar-days" class="w-5 h-5 mr-2 text-indigo-500"></i> Lini Masa Harian</h3>
                            <div class="flex bg-gray-100 dark:bg-slate-900 p-1 rounded-xl">
                                <button onclick="switchCalendarView('mingguan')" class="px-4 py-1.5 text-xs font-bold rounded-lg transition-all ${state.calendarView === 'mingguan' ? 'bg-white dark:bg-slate-700 shadow-sm text-indigo-600 dark:text-indigo-400' : 'text-gray-500 hover:text-gray-700'}">Mingguan</button>
                                <button onclick="switchCalendarView('bulanan')" class="px-4 py-1.5 text-xs font-bold rounded-lg transition-all ${state.calendarView === 'bulanan' ? 'bg-white dark:bg-slate-700 shadow-sm text-indigo-600 dark:text-indigo-400' : 'text-gray-500 hover:text-gray-700'}">Bulanan</button>
                            </div>
                        </div>
                        <div class="flex-1 overflow-hidden flex flex-col">
                            <div class="grid gap-3 overflow-y-auto p-1 h-full content-start ${state.calendarView === 'mingguan' ? 'grid-cols-2 sm:grid-cols-3 md:grid-cols-7' : 'grid-cols-2 sm:grid-cols-4 md:grid-cols-7'}">${calendarHtml}</div>
                        </div>
                    </div>
                </div>
            `;
        }

        // --- RENDER NOTULENSI (UNTUK HALAMAN ORG & FISIKA) ---
        function renderNotesPanel() {
            // Mode Form (Tambah/Edit)
            if (state.editingNoteId !== null) {
                let note = { title: '', date: new Date().toISOString().split('T')[0], content: '' };
                if (state.editingNoteId !== 'new') {
                    note = state.notesList.find(n => n.id === state.editingNoteId) || note;
                }
                
                return `
                    <div class="flex flex-col h-full bg-white dark:bg-slate-800/50 rounded-2xl border border-gray-100 dark:border-slate-700/50 shadow-sm overflow-hidden fade-in">
                        <div class="p-4 md:p-5 border-b border-gray-100 dark:border-slate-700/50 flex justify-between items-center bg-gray-50/50 dark:bg-slate-900/30">
                            <h3 class="font-bold text-gray-800 dark:text-white flex items-center">
                                <i data-lucide="edit-3" class="w-4 h-4 mr-2 text-indigo-500"></i> Editor Notulensi
                            </h3>
                            <div class="flex gap-2">
                                <button onclick="closeNoteForm()" class="px-3 py-1.5 text-xs font-bold rounded-lg text-gray-500 hover:bg-gray-200 dark:hover:bg-slate-700 transition-colors">Batal</button>
                                <button onclick="document.getElementById('form-note').requestSubmit()" class="px-4 py-1.5 text-xs font-bold rounded-lg bg-indigo-600 text-white hover:bg-indigo-700 transition-colors shadow-sm">Simpan</button>
                            </div>
                        </div>
                        <form id="form-note" onsubmit="saveNoteForm(event)" class="p-4 md:p-5 flex-1 flex flex-col gap-4 overflow-y-auto custom-scrollbar">
                            <div class="flex flex-col sm:flex-row gap-4">
                                <input type="text" id="note-title" required value="${note.title}" placeholder="Judul Rapat / Catatan..." class="flex-1 px-4 py-2.5 text-sm font-semibold bg-gray-50 dark:bg-slate-900 border border-gray-200 dark:border-slate-700 rounded-xl focus:ring-2 focus:ring-indigo-500/50 outline-none dark:text-white" />
                                <input type="date" id="note-date" required value="${note.date}" class="sm:w-40 px-4 py-2.5 text-sm bg-gray-50 dark:bg-slate-900 border border-gray-200 dark:border-slate-700 rounded-xl focus:ring-2 focus:ring-indigo-500/50 outline-none dark:text-white" />
                            </div>
                            <textarea id="note-content" required placeholder="Tulis notulensi atau rangkuman di sini..." class="flex-1 w-full p-4 text-sm bg-gray-50/50 dark:bg-slate-900/50 border border-gray-200 dark:border-slate-700 rounded-xl resize-none focus:ring-2 focus:ring-indigo-500/50 outline-none dark:text-gray-200 leading-relaxed min-h-[250px]">${note.content}</textarea>
                        </form>
                    </div>
                `;
            }

            // Mode List Notulensi
            const filteredNotes = state.notesList.filter(n => n.category === state.activeTab && n.subCategory === state.activeSub);
            
            let notesHtml = filteredNotes.length === 0 
                ? `<div class="flex-1 flex flex-col items-center justify-center text-gray-400 mt-10"><i data-lucide="file-text" class="w-10 h-10 mb-3 opacity-20"></i><p class="text-sm">Belum ada notulensi.</p></div>`
                : `<div class="grid gap-3 overflow-y-auto pr-2 custom-scrollbar">` + 
                  filteredNotes.sort((a,b) => new Date(b.date) - new Date(a.date)).map(note => `
                    <div class="group bg-white dark:bg-slate-800 border border-gray-100 dark:border-slate-700 rounded-xl p-4 hover:border-indigo-300 dark:hover:border-indigo-700 transition-all cursor-pointer shadow-sm hover:shadow-md flex justify-between items-start" onclick="editNote('${note.id}')">
                        <div class="pr-4">
                            <h4 class="text-sm font-bold text-gray-800 dark:text-gray-100 mb-1 group-hover:text-indigo-600 dark:group-hover:text-indigo-400 transition-colors">${note.title}</h4>
                            <p class="text-[11px] font-medium text-gray-500 flex items-center"><i data-lucide="calendar" class="w-3 h-3 mr-1"></i> ${new Date(note.date).toLocaleDateString('id-ID', {day:'numeric', month:'long', year:'numeric'})}</p>
                        </div>
                        <button onclick="event.stopPropagation(); deleteNoteItem('${note.id}')" class="p-2 text-gray-400 hover:text-rose-500 hover:bg-rose-50 dark:hover:bg-rose-900/30 rounded-lg transition-colors">
                            <i data-lucide="trash-2" class="w-4 h-4"></i>
                        </button>
                    </div>
                  `).join('') + `</div>`;

            return `
                <div class="bg-white dark:bg-slate-800/50 rounded-2xl border border-gray-100 dark:border-slate-700/50 p-5 md:p-6 flex flex-col shadow-sm h-full max-h-[80vh]">
                    <div class="flex justify-between items-center mb-6">
                        <h3 class="text-base md:text-lg font-bold text-gray-800 dark:text-white flex items-center">
                            <i data-lucide="files" class="w-5 h-5 mr-2 text-indigo-500"></i> Arsip Notulensi
                        </h3>
                        <button onclick="openNewNoteForm()" class="px-4 py-2 bg-indigo-50 text-indigo-700 dark:bg-indigo-500/10 dark:text-indigo-400 text-xs font-bold rounded-lg hover:bg-indigo-100 dark:hover:bg-indigo-500/20 transition-colors flex items-center">
                            <i data-lucide="plus" class="w-4 h-4 mr-1"></i> Buat Notulensi
                        </button>
                    </div>
                    ${notesHtml}
                </div>
            `;
        }

        function renderOrgBoard() {
            if(!state.activeSub) {
                return `
                    ${renderSubCategoriesPills()}
                    <div class="text-center mt-20 text-gray-500"><p>Silakan pilih atau tambah Proker/Divisi terlebih dahulu.</p></div>
                `;
            }
            return `
                <div class="flex flex-col h-full fade-in">
                    ${renderSubCategoriesPills()}
                    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 flex-1 min-h-0">
                        <div class="bg-white dark:bg-slate-800/50 rounded-2xl border border-gray-100 dark:border-slate-700/50 p-5 md:p-6 flex flex-col shadow-sm h-full max-h-[80vh]">
                            <h3 class="text-base md:text-lg font-bold mb-4 text-gray-800 dark:text-white flex items-center"><i data-lucide="check-square" class="w-5 h-5 mr-2 text-brand-500"></i> To-Do: ${state.activeSub}</h3>
                            <form onsubmit="handleTaskSubmit(event)" class="flex gap-2 mb-6">
                                <input type="text" id="task-title" placeholder="Ketik agenda..." required class="flex-1 px-4 py-2.5 text-sm bg-gray-50 dark:bg-slate-900 border border-gray-200 dark:border-slate-700 rounded-xl focus:ring-2 focus:ring-brand-500/50 outline-none dark:text-white" />
                                <input type="date" id="task-date" class="w-32 px-3 py-2.5 text-sm bg-gray-50 dark:bg-slate-900 border border-gray-200 dark:border-slate-700 rounded-xl focus:ring-2 focus:ring-brand-500/50 outline-none dark:text-white" />
                                <button type="submit" class="px-4 py-2.5 bg-brand-600 text-white rounded-xl hover:bg-brand-700 transition-colors font-medium"><i data-lucide="plus" class="w-4 h-4"></i></button>
                            </form>
                            <div class="flex-1 overflow-y-auto pr-2 custom-scrollbar">${renderTaskList()}</div>
                        </div>
                        ${renderNotesPanel()}
                    </div>
                </div>
            `;
        }

        // --- HALAMAN FISIKA (Dengan AI & Notulensi) ---
        async function generateAIQuiz() {
            const resultBox = document.getElementById('ai-result');
            const materialText = document.getElementById('ai-material-text').value;
            if (!GEMINI_API_KEY) {
                resultBox.innerHTML = '<div class="text-rose-500 text-sm font-bold text-center mt-6">API Key Gemini belum dimasukkan di kode HTML.</div>';
                return;
            }
            if (!materialText.trim()) return;

            const btn = document.getElementById('btn-generate');
            btn.innerHTML = '<i data-lucide="loader-2" class="w-4 h-4 mr-2 animate-spin"></i> Proses...';
            btn.disabled = true;
            resultBox.innerHTML = '<div class="text-brand-600 text-sm text-center mt-6 animate-pulse">Menyusun latihan soal untuk ' + state.activeSub + '...</div>';

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_API_KEY}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ role: 'user', parts: [{text: `Buatkan 3 soal latihan dan kunci jawaban untuk mata kuliah Fisika bab: ${state.activeSub}, berdasarkan materi ini:\n${materialText}`}] }] })
                });
                const result = await response.json();
                if (result.candidates) {
                    resultBox.innerHTML = `<div class="prose prose-sm dark:prose-invert max-w-none">${marked.parse(result.candidates[0].content.parts[0].text)}</div>`;
                }
            } catch (error) {
                resultBox.innerHTML = `<div class="text-rose-500 text-sm text-center mt-6">Gagal menghubungi AI.</div>`;
            } finally {
                btn.innerHTML = '<i data-lucide="sparkles" class="w-4 h-4 mr-2"></i> Buat Soal AI';
                btn.disabled = false;
                lucide.createIcons();
            }
        }

        function renderFisikaBoard() {
            if(!state.activeSub) {
                return `
                    ${renderSubCategoriesPills()}
                    <div class="text-center mt-20 text-gray-500"><p>Silakan pilih atau tambah Mata Kuliah terlebih dahulu.</p></div>
                `;
            }

            return `
                <div class="flex flex-col h-full fade-in">
                    ${renderSubCategoriesPills()}
                    
                    <!-- Layout Grid: Kiri Tugas, Tengah Notes, Kanan AI -->
                    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 flex-1 min-h-0">
                        
                        <!-- Kolom 1: To-Do List -->
                        <div class="bg-white dark:bg-slate-800/50 rounded-2xl border border-gray-100 dark:border-slate-700/50 p-5 flex flex-col shadow-sm max-h-[80vh]">
                            <h3 class="text-base font-bold mb-4 flex items-center"><i data-lucide="check-square" class="w-5 h-5 mr-2 text-brand-500"></i> Tugas ${state.activeSub}</h3>
                            <form onsubmit="handleTaskSubmit(event)" class="flex flex-col gap-2 mb-4">
                                <input type="text" id="task-title" placeholder="Ketik tugas..." required class="w-full px-3 py-2 text-sm bg-gray-50 dark:bg-slate-900 border border-gray-200 dark:border-slate-700 rounded-xl focus:ring-2 focus:ring-brand-500/50 outline-none dark:text-white" />
                                <div class="flex gap-2">
                                    <input type="date" id="task-date" class="flex-1 px-3 py-2 text-sm bg-gray-50 dark:bg-slate-900 border border-gray-200 dark:border-slate-700 rounded-xl outline-none dark:text-white" />
                                    <button type="submit" class="px-4 py-2 bg-brand-600 text-white rounded-xl hover:bg-brand-700"><i data-lucide="plus" class="w-4 h-4"></i></button>
                                </div>
                            </form>
                            <div class="flex-1 overflow-y-auto pr-1 custom-scrollbar">${renderTaskList()}</div>
                        </div>

                        <!-- Kolom 2: Catatan / Notulensi Matkul -->
                        ${renderNotesPanel()}

                        <!-- Kolom 3: AI Generator -->
                        <div class="bg-white dark:bg-slate-800/50 rounded-2xl border border-gray-100 dark:border-slate-700/50 p-5 flex flex-col shadow-sm max-h-[80vh]">
                            <div class="flex items-center justify-between mb-4">
                                <h3 class="text-base font-bold flex items-center"><i data-lucide="bot" class="w-5 h-5 mr-2 text-purple-500"></i> AI Latihan</h3>
                                <span class="px-2 py-0.5 bg-purple-100 text-purple-700 text-[9px] font-bold rounded-md uppercase">Gemini</span>
                            </div>
                            <textarea id="ai-material-text" placeholder="Paste materi ${state.activeSub} di sini..." class="w-full h-24 p-3 mb-3 text-sm bg-gray-50 dark:bg-slate-900 border border-gray-200 dark:border-slate-700 rounded-xl resize-none focus:ring-2 focus:ring-purple-500/50 outline-none dark:text-white"></textarea>
                            <button id="btn-generate" onclick="generateAIQuiz()" class="w-full py-2.5 bg-gradient-to-r from-purple-600 to-indigo-600 text-white rounded-xl hover:from-purple-700 hover:to-indigo-700 font-bold text-sm flex justify-center items-center">
                                <i data-lucide="sparkles" class="w-4 h-4 mr-2"></i> Buat Latihan Soal
                            </button>
                            <div id="ai-result" class="flex-1 mt-4 p-4 bg-gray-50/80 dark:bg-slate-900/80 rounded-xl border border-gray-100 dark:border-slate-700/50 overflow-y-auto custom-scrollbar">
                                <p class="text-xs text-center text-gray-400 mt-10">Hasil AI akan muncul di sini.</p>
                            </div>
                        </div>

                    </div>
                </div>
            `;
        }

        function renderWorkspace() {
            const workspace = document.getElementById('workspace');
            if (state.activeTab === CATEGORIES.DASHBOARD) workspace.innerHTML = renderDashboard();
            else if (state.activeTab === CATEGORIES.FISIKA) workspace.innerHTML = renderFisikaBoard();
            else workspace.innerHTML = renderOrgBoard();
            lucide.createIcons();
        }

        // INIT APP
        window.onload = () => {
            renderNavigation();
            renderHeader();
            renderWorkspace();
            if (!state.isDark) {
                document.documentElement.classList.remove('dark');
                document.getElementById('theme-icon').setAttribute('data-lucide', 'moon');
                document.getElementById('theme-text').textContent = 'Mode Gelap';
            }
        };
    </script>
</body>
</html>
