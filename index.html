<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MHA Workspace - Mahasiswa Fisika & Aktivis</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: { brand: { 50: '#f0fdfa', 500: '#14b8a6', 600: '#0d9488', 900: '#134e4a' } }
                }
            }
        }
    </script>
    <style>
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .dark ::-webkit-scrollbar-thumb { background: #475569; }
        body { transition: background-color 0.3s ease, color 0.3s ease; }
        .fade-in { animation: fadeIn 0.4s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        /* Styling Table */
        table { border-collapse: separate; border-spacing: 0; }
        th { white-space: nowrap; }
    </style>
</head>
<body class="bg-[#F8FAFC] dark:bg-[#090E17] text-gray-900 dark:text-gray-100 flex h-screen overflow-hidden selection:bg-indigo-500/30">

    <!-- Sidebar -->
    <aside id="sidebar" class="fixed inset-y-0 left-0 z-50 w-72 bg-white dark:bg-[#111827] border-r border-gray-200 dark:border-slate-800/60 transform -translate-x-full md:translate-x-0 md:static flex flex-col shadow-2xl md:shadow-none transition-transform duration-300">
        <div class="p-6 md:p-8 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-indigo-500 to-purple-600 flex items-center justify-center text-white font-black text-xl shadow-lg shadow-indigo-500/20">M</div>
                <div>
                    <h1 class="font-bold text-lg tracking-tight leading-tight">Aditya Dwi</h1>
                    <p class="text-[10px] font-bold text-gray-500 dark:text-gray-400 uppercase tracking-widest">Workspace</p>
                </div>
            </div>
            <button onclick="toggleMobileMenu()" class="md:hidden p-2 bg-gray-100 dark:bg-slate-800 rounded-lg text-gray-500">
                <i data-lucide="x" class="w-5 h-5"></i>
            </button>
        </div>
        
        <nav id="nav-menu" class="flex-1 px-4 md:px-6 space-y-1.5 overflow-y-auto custom-scrollbar">
            <!-- Inject dari JS -->
        </nav>

        <div class="p-6 border-t border-gray-100 dark:border-slate-800/60 mt-auto flex flex-col gap-3">
            <button onclick="openCategoryModal()" class="w-full flex items-center justify-center gap-2 px-4 py-3 text-sm font-bold text-indigo-600 dark:text-indigo-400 bg-indigo-50 dark:bg-indigo-500/10 rounded-xl hover:bg-indigo-100 dark:hover:bg-indigo-500/20 transition-colors border border-indigo-100 dark:border-indigo-500/20">
                <i data-lucide="folder-plus" class="w-4 h-4"></i> Tambah Kategori
            </button>
            <button onclick="toggleDarkMode()" class="w-full flex items-center justify-center gap-2 px-4 py-3 text-sm font-bold text-gray-700 dark:text-gray-300 bg-gray-100 dark:bg-slate-800/80 rounded-xl hover:bg-gray-200 dark:hover:bg-slate-700 transition-colors">
                <i data-lucide="moon" id="theme-icon" class="w-4 h-4"></i>
                <span id="theme-text">Mode Gelap</span>
            </button>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 flex flex-col min-w-0 relative">
        <header class="md:hidden flex items-center justify-between p-4 bg-white/80 dark:bg-[#111827]/80 backdrop-blur-md border-b border-gray-200 dark:border-slate-800/60 sticky top-0 z-30">
            <div class="flex items-center gap-3">
                <button onclick="toggleMobileMenu()" class="p-2 bg-gray-100 dark:bg-slate-800 rounded-lg text-gray-600 dark:text-gray-400">
                    <i data-lucide="menu" class="w-5 h-5"></i>
                </button>
                <h2 id="mobile-header-title" class="font-bold text-lg truncate w-40">Dashboard</h2>
            </div>
        </header>

        <header class="hidden md:flex items-center justify-between px-10 py-8 max-w-[1400px] mx-auto w-full">
            <div>
                <h2 id="desktop-header-title" class="text-3xl font-black tracking-tight flex items-center gap-3">Dashboard</h2>
                <p id="desktop-header-desc" class="text-sm font-medium text-gray-500 dark:text-gray-400 mt-1.5">Sistem monitoring terpusat kegiatan Aditya Dwi.</p>
            </div>
            <div class="flex items-center gap-3 bg-white dark:bg-[#111827] px-4 py-2 rounded-full border border-gray-200 dark:border-slate-800/60 shadow-sm">
                <div class="w-8 h-8 rounded-full bg-slate-200 dark:bg-slate-700 flex items-center justify-center text-slate-600 dark:text-slate-300 font-bold text-xs">
                    <i data-lucide="user" class="w-4 h-4"></i>
                </div>
                <span class="text-sm font-bold text-gray-700 dark:text-gray-300 pr-2">Aktivis & Mahasiswa</span>
            </div>
        </header>

        <div id="workspace" class="flex-1 overflow-y-auto px-4 md:px-10 pb-10 max-w-[1400px] mx-auto w-full flex flex-col">
            <!-- Content inject via JS -->
        </div>
    </main>

    <!-- Overlay Mobile -->
    <div id="mobile-overlay" onclick="toggleMobileMenu()" class="fixed inset-0 bg-slate-900/50 dark:bg-black/60 z-40 hidden backdrop-blur-sm transition-opacity"></div>

    <!-- Modal Tambah Kategori -->
    <div id="category-modal" class="fixed inset-0 bg-slate-900/50 dark:bg-black/60 z-50 hidden items-center justify-center backdrop-blur-sm p-4">
        <div class="bg-white dark:bg-slate-800 rounded-2xl w-full max-w-md p-6 shadow-2xl transform scale-95 transition-transform" id="category-modal-content">
            <h3 class="text-lg font-bold text-gray-800 dark:text-white mb-4">Tambah Kategori Baru</h3>
            <form onsubmit="saveNewCategory(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-gray-500 dark:text-gray-400 uppercase mb-1">Nama Kategori</label>
                    <input type="text" id="new-cat-name" required placeholder="Contoh: Panitia Seminar, BEM Fakultas..." class="w-full px-4 py-2.5 text-sm bg-gray-50 dark:bg-slate-900 border border-gray-200 dark:border-slate-700 rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none dark:text-white" />
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-500 dark:text-gray-400 uppercase mb-1">Format Tabel & Tipe</label>
                    <select id="new-cat-type" required class="w-full px-4 py-2.5 text-sm bg-gray-50 dark:bg-slate-900 border border-gray-200 dark:border-slate-700 rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none dark:text-white">
                        <option value="organisasi">Format Organisasi (Sie, Keterangan, Progres)</option>
                        <option value="kuliah">Format Kuliah (Bab, Ngapain, Progres)</option>
                        <option value="lomba">Format Lomba (Jenis, Luaran, Sumber, Progres)</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-500 dark:text-gray-400 uppercase mb-1">Ikon Menu</label>
                    <select id="new-cat-icon" required class="w-full px-4 py-2.5 text-sm bg-gray-50 dark:bg-slate-900 border border-gray-200 dark:border-slate-700 rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none dark:text-white">
                        <option value="folder">Folder (Standar)</option>
                        <option value="book-open">Buku (Akademik)</option>
                        <option value="users">Orang (Komunitas/Tim)</option>
                        <option value="award">Piala (Lomba/Prestasi)</option>
                        <option value="briefcase">Koper (Kerja/Proyek)</option>
                    </select>
                </div>
                <div class="flex gap-3 mt-6">
                    <button type="button" onclick="closeCategoryModal()" class="flex-1 px-4 py-2.5 text-sm font-bold text-gray-600 bg-gray-100 hover:bg-gray-200 dark:bg-slate-700 dark:text-gray-300 dark:hover:bg-slate-600 rounded-xl transition-colors">Batal</button>
                    <button type="submit" class="flex-1 px-4 py-2.5 text-sm font-bold text-white bg-indigo-600 hover:bg-indigo-700 rounded-xl transition-colors">Simpan Kategori</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // ==========================================
        // 1. STATE & INISIALISASI DATA DINAMIS
        // ==========================================
        const GEMINI_API_KEY = ""; // PASTE API KEY ANDA DI SINI

        const DEFAULT_CATEGORIES = [
            { id: 'dashboard', name: 'Dashboard Pribadi', type: 'system', icon: 'home' },
            { id: 'fisika', name: 'Kuliah Fisika', type: 'kuliah', icon: 'book-open' },
            { id: 'kopma', name: 'Kopma', type: 'organisasi', icon: 'users' },
            { id: 'bem', name: 'BEM Universitas', type: 'organisasi', icon: 'landmark' },
            { id: 'pmii', name: 'PMII Ibnu Sina', type: 'organisasi', icon: 'flag' },
            { id: 'lomba', name: 'Lomba & Kompetisi', type: 'lomba', icon: 'award' }
        ];

        let state = {
            activeTab: 'dashboard',
            activeSub: null,
            isDark: JSON.parse(localStorage.getItem('mha_v4_theme')) || false, // Default Light Mode
            isMobileMenuOpen: false,
            
            categories: JSON.parse(localStorage.getItem('mha_v4_categories')) || DEFAULT_CATEGORIES,
            subCategories: JSON.parse(localStorage.getItem('mha_v4_subs')) || {
                'fisika': ['Fisika Dasar', 'Mekanika Kuantum'],
                'kopma': ['Bazar Mahasiswa', 'Rapat Rutin'],
                'lomba': ['PKM 2024', 'Esai Nasional']
            },
            tasks: JSON.parse(localStorage.getItem('mha_v4_tasks')) || [], 
            notesList: JSON.parse(localStorage.getItem('mha_v4_notes')) || [], 
            
            calendarView: 'mingguan',
            editingNoteId: null 
        };

        function saveData() {
            localStorage.setItem('mha_v4_categories', JSON.stringify(state.categories));
            localStorage.setItem('mha_v4_subs', JSON.stringify(state.subCategories));
            localStorage.setItem('mha_v4_tasks', JSON.stringify(state.tasks));
            localStorage.setItem('mha_v4_notes', JSON.stringify(state.notesList));
        }

        function getActiveCategoryObj() {
            return state.categories.find(c => c.id === state.activeTab);
        }

        // ==========================================
        // 2. KONTROL MENU & TEMA
        // ==========================================
        function toggleMobileMenu() {
            state.isMobileMenuOpen = !state.isMobileMenuOpen;
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('mobile-overlay');
            if (state.isMobileMenuOpen) {
                sidebar.classList.remove('-translate-x-full');
                overlay.classList.remove('hidden');
            } else {
                sidebar.classList.add('-translate-x-full');
                overlay.classList.add('hidden');
            }
        }

        function syncTheme() {
            const html = document.documentElement;
            const icon = document.getElementById('theme-icon');
            const text = document.getElementById('theme-text');
            if (state.isDark) {
                html.classList.add('dark');
                icon.setAttribute('data-lucide', 'sun');
                text.textContent = 'Mode Terang';
            } else {
                html.classList.remove('dark');
                icon.setAttribute('data-lucide', 'moon');
                text.textContent = 'Mode Gelap';
            }
            localStorage.setItem('mha_v4_theme', state.isDark);
            lucide.createIcons();
        }

        function toggleDarkMode() {
            state.isDark = !state.isDark;
            syncTheme();
        }

        function switchTab(tabId) {
            state.activeTab = tabId;
            const subs = state.subCategories[tabId] || [];
            state.activeSub = subs.length > 0 ? subs[0] : null;
            state.editingNoteId = null;

            if (state.isMobileMenuOpen) toggleMobileMenu();
            renderNavigation();
            renderHeader();
            renderWorkspace();
        }

        function switchCalendarView(view) {
            state.calendarView = view;
            renderWorkspace();
        }

        // ==========================================
        // 3. LOGIKA KATEGORI & SUB KATEGORI
        // ==========================================
        function openCategoryModal() {
            document.getElementById('category-modal').classList.remove('hidden');
            document.getElementById('category-modal').classList.add('flex');
            document.getElementById('category-modal-content').classList.remove('scale-95');
        }
        function closeCategoryModal() {
            document.getElementById('category-modal').classList.add('hidden');
            document.getElementById('category-modal').classList.remove('flex');
            document.getElementById('category-modal-content').classList.add('scale-95');
        }
        function saveNewCategory(event) {
            event.preventDefault();
            const name = document.getElementById('new-cat-name').value;
            const type = document.getElementById('new-cat-type').value;
            const icon = document.getElementById('new-cat-icon').value;
            const id = 'cat_' + Date.now();

            state.categories.push({ id, name, type, icon });
            saveData();
            closeCategoryModal();
            renderNavigation();
            switchTab(id);
        }

        function deleteCategory() {
            const catObj = getActiveCategoryObj();
            if(!catObj || catObj.id === 'dashboard') return;
            
            if(confirm(`PERINGATAN!\n\nAnda yakin ingin menghapus Kategori "${catObj.name}"?\nSemua Sub-Kategori, Tugas, dan Notulensi di dalamnya akan hilang permanen.`)) {
                state.categories = state.categories.filter(c => c.id !== catObj.id);
                delete state.subCategories[catObj.id];
                state.tasks = state.tasks.filter(t => t.categoryId !== catObj.id);
                state.notesList = state.notesList.filter(n => n.categoryId !== catObj.id);
                
                saveData();
                switchTab('dashboard');
            }
        }

        function addSubCategory() {
            const catObj = getActiveCategoryObj();
            let noun = catObj.type === 'kuliah' ? 'Mata Kuliah' : catObj.type === 'lomba' ? 'Nama/Tema Lomba' : 'Program Kerja / Divisi';
            const name = prompt(`Masukkan ${noun} baru:`);
            if(name && name.trim() !== '') {
                if(!state.subCategories[state.activeTab]) state.subCategories[state.activeTab] = [];
                if(!state.subCategories[state.activeTab].includes(name.trim())) {
                    state.subCategories[state.activeTab].push(name.trim());
                }
                state.activeSub = name.trim();
                state.editingNoteId = null;
                saveData();
                renderWorkspace();
            }
        }
        
        function deleteSubCategory() {
            if(!state.activeSub) return;
            if(confirm(`Yakin ingin menghapus sub-kategori "${state.activeSub}" beserta seluruh tabel & catatannya?`)) {
                state.subCategories[state.activeTab] = state.subCategories[state.activeTab].filter(s => s !== state.activeSub);
                state.tasks = state.tasks.filter(t => !(t.categoryId === state.activeTab && t.subCategory === state.activeSub));
                state.notesList = state.notesList.filter(n => !(n.categoryId === state.activeTab && n.subCategory === state.activeSub));
                
                saveData();
                const remainingSubs = state.subCategories[state.activeTab];
                state.activeSub = remainingSubs && remainingSubs.length > 0 ? remainingSubs[0] : null;
                renderWorkspace();
            }
        }

        function selectSubCategory(subName) {
            state.activeSub = subName;
            state.editingNoteId = null;
            renderWorkspace();
        }

        // ==========================================
        // 4. LOGIKA DATA TABEL
        // ==========================================
        function addTask(event) {
            event.preventDefault();
            const catObj = getActiveCategoryObj();
            const fd = new FormData(event.target);
            
            const data = {};
            for (let [key, value] of fd.entries()) {
                data[key] = value;
            }
            data.progres = 'Belum';

            state.tasks.push({
                id: Date.now().toString(),
                categoryId: state.activeTab,
                subCategory: state.activeSub,
                type: catObj.type,
                data: data
            });
            
            saveData();
            renderWorkspace();
        }

        function updateTaskProgress(id, value) {
            state.tasks = state.tasks.map(t => {
                if(t.id === id) t.data.progres = value;
                return t;
            });
            saveData();
            renderWorkspace();
        }

        function deleteTask(id) {
            if(confirm("Hapus baris ini dari tabel?")) {
                state.tasks = state.tasks.filter(t => t.id !== id);
                saveData();
                renderWorkspace();
            }
        }

        // ==========================================
        // 5. MANAJEMEN NOTULENSI
        // ==========================================
        function openNewNoteForm() { state.editingNoteId = 'new'; renderWorkspace(); }
        function editNote(id) { state.editingNoteId = id; renderWorkspace(); }
        function closeNoteForm() { state.editingNoteId = null; renderWorkspace(); }
        function saveNoteForm(event) {
            event.preventDefault();
            const title = document.getElementById('note-title').value;
            const date = document.getElementById('note-date').value;
            const content = document.getElementById('note-content').value;

            if(state.editingNoteId === 'new') {
                state.notesList.push({ id: Date.now().toString(), title, date, content, categoryId: state.activeTab, subCategory: state.activeSub });
            } else {
                state.notesList = state.notesList.map(n => n.id === state.editingNoteId ? { ...n, title, date, content } : n);
            }
            saveData();
            closeNoteForm();
        }
        function deleteNoteItem(id) {
            if(confirm('Hapus notulensi ini?')) {
                state.notesList = state.notesList.filter(n => n.id !== id);
                saveData();
                renderWorkspace();
            }
        }

        // ==========================================
        // 6. RENDER ENGINE (UI)
        // ==========================================
        function renderNavigation() {
            document.getElementById('nav-menu').innerHTML = state.categories.map(cat => `
                <button onclick="switchTab('${cat.id}')"
                    class="w-full flex items-center gap-3.5 px-4 py-3.5 text-sm font-semibold rounded-2xl transition-all ${
                        state.activeTab === cat.id 
                            ? 'bg-indigo-50 text-indigo-700 dark:bg-indigo-500/10 dark:text-indigo-400 shadow-sm' 
                            : 'text-gray-600 hover:bg-gray-50 hover:text-gray-900 dark:text-gray-400 dark:hover:bg-slate-800/40 dark:hover:text-gray-200'
                    }">
                    <i data-lucide="${cat.icon}" class="w-5 h-5"></i>
                    <span class="truncate text-left flex-1">${cat.name}</span>
                </button>
            `).join('');
            lucide.createIcons();
        }

        function renderHeader() {
            const catObj = getActiveCategoryObj();
            document.getElementById('mobile-header-title').textContent = catObj.name;
            document.getElementById('desktop-header-title').innerHTML = `<i data-lucide="${catObj.icon}" class="w-8 h-8 text-indigo-500 mr-2"></i> ${catObj.name}`;
            
            let desc = "";
            if(catObj.type === 'system') desc = "Ringkasan agenda, deadline terdekat, dan kalender aktivitas.";
            else if(catObj.type === 'kuliah') desc = "Tabel pencapaian materi, tugas, dan pemahaman.";
            else if(catObj.type === 'lomba') desc = "Manajemen kelengkapan berkas dan luaran kompetisi.";
            else desc = `Fokus pencapaian program kerja dan kepanitiaan ${catObj.name}.`;
            document.getElementById('desktop-header-desc').textContent = desc;
            lucide.createIcons();
        }

        function renderSubCategoriesPills() {
            const subs = state.subCategories[state.activeTab] || [];
            let html = `<div class="flex items-center gap-2 mb-6 overflow-x-auto pb-2 custom-scrollbar shrink-0 fade-in w-full">`;
            
            subs.forEach(sub => {
                const isActive = state.activeSub === sub;
                html += `
                    <button onclick="selectSubCategory('${sub}')" 
                        class="px-5 py-2 rounded-xl text-sm font-bold whitespace-nowrap transition-all border ${
                        isActive ? 'bg-indigo-600 text-white border-indigo-600 shadow-md shadow-indigo-500/20' : 'bg-white dark:bg-slate-800 text-gray-600 dark:text-gray-300 border-gray-200 dark:border-slate-700 hover:bg-gray-50 dark:hover:bg-slate-700'
                    }">${sub}</button>
                `;
            });

            html += `
                <button onclick="addSubCategory()" class="px-4 py-2 rounded-xl text-sm font-bold whitespace-nowrap border-2 border-dashed border-gray-300 dark:border-slate-600 text-gray-500 hover:text-indigo-600 hover:border-indigo-400 transition-colors flex items-center shrink-0">
                    <i data-lucide="plus" class="w-4 h-4 mr-1"></i> Tambah
                </button>
            `;

            if (state.activeSub) {
                html += `
                    <div class="h-6 w-px bg-gray-200 dark:bg-slate-700 mx-1 shrink-0"></div>
                    <button onclick="deleteSubCategory()" class="px-3 py-2 rounded-xl text-sm font-bold whitespace-nowrap text-rose-500 hover:bg-rose-50 dark:hover:bg-rose-900/30 transition-colors flex items-center shrink-0" title="Hapus Sub-Kategori ini">
                        <i data-lucide="trash-2" class="w-4 h-4"></i>
                    </button>
                `;
            }

            if (state.activeTab !== 'dashboard') {
                html += `
                    <div class="flex-1 min-w-[20px]"></div>
                    <button onclick="deleteCategory()" class="px-4 py-2 rounded-xl text-xs font-bold whitespace-nowrap text-rose-600 bg-rose-50 hover:bg-rose-100 dark:bg-rose-500/10 dark:hover:bg-rose-500/20 dark:text-rose-400 transition-colors flex items-center shadow-sm shrink-0">
                        <i data-lucide="trash" class="w-3.5 h-3.5 mr-1.5"></i> Hapus Kategori
                    </button>
                `;
            }

            html += `</div>`;
            return html;
        }

        // --- RENDER FORM INPUT (DIPERBARUI MENGGUNAKAN LINK PENGUMPULAN) ---
        function renderSpecificForm(type) {
            let fields = '';
            if(type === 'organisasi') {
                fields = `
                    <input type="text" name="sie" placeholder="Sie / Divisi..." required class="w-32 shrink-0 px-3 py-2 text-sm border dark:border-slate-700 rounded-lg dark:bg-slate-900 outline-none focus:border-indigo-500 dark:text-white" />
                    <input type="text" name="keterangan" placeholder="Keterangan / Aktivitas..." required class="flex-1 px-3 py-2 text-sm border dark:border-slate-700 rounded-lg dark:bg-slate-900 outline-none focus:border-indigo-500 dark:text-white" />
                    <div class="flex gap-1 items-center bg-gray-50 dark:bg-slate-800 p-1 rounded-lg border dark:border-slate-700 shrink-0">
                        <span class="text-[10px] uppercase font-bold text-gray-400 px-2">DL:</span>
                        <input type="date" name="deadline" required class="w-32 px-2 py-1.5 text-xs bg-transparent outline-none dark:text-white" title="Deadline" />
                    </div>
                    <input type="url" name="linkPengumpulan" placeholder="Link Kumpul..." class="w-32 shrink-0 px-3 py-2 text-sm border dark:border-slate-700 rounded-lg dark:bg-slate-900 outline-none focus:border-indigo-500 dark:text-white" title="Masukkan URL/Link Tugas" />
                `;
            } else if (type === 'kuliah') {
                fields = `
                    <input type="text" name="bab" placeholder="Bab / Topik..." required class="w-32 shrink-0 px-3 py-2 text-sm border dark:border-slate-700 rounded-lg dark:bg-slate-900 outline-none focus:border-indigo-500 dark:text-white" />
                    <input type="text" name="ngapain" placeholder="Ngapain? (Tugas/Praktek)..." required class="flex-1 px-3 py-2 text-sm border dark:border-slate-700 rounded-lg dark:bg-slate-900 outline-none focus:border-indigo-500 dark:text-white" />
                    <div class="flex gap-1 items-center bg-gray-50 dark:bg-slate-800 p-1 rounded-lg border dark:border-slate-700 shrink-0">
                        <span class="text-[10px] uppercase font-bold text-gray-400 px-2">DL:</span>
                        <input type="date" name="deadline" required class="w-32 px-2 py-1.5 text-xs bg-transparent outline-none dark:text-white" title="Deadline" />
                    </div>
                    <input type="url" name="linkPengumpulan" placeholder="Link Kumpul..." class="w-32 shrink-0 px-3 py-2 text-sm border dark:border-slate-700 rounded-lg dark:bg-slate-900 outline-none focus:border-indigo-500 dark:text-white" title="Masukkan URL/Link Tugas" />
                `;
            } else if (type === 'lomba') {
                fields = `
                    <input type="text" name="namaLomba" placeholder="Nama Lomba..." required class="flex-1 px-3 py-2 text-sm border dark:border-slate-700 rounded-lg dark:bg-slate-900 outline-none focus:border-indigo-500 dark:text-white" />
                    <select name="jenis" class="w-24 shrink-0 px-3 py-2 text-sm border dark:border-slate-700 rounded-lg dark:bg-slate-900 outline-none focus:border-indigo-500 dark:text-white">
                        <option value="Individu">Individu</option>
                        <option value="Kelompok">Kelompok</option>
                    </select>
                    <input type="text" name="luaran" placeholder="Luaran..." required class="w-24 shrink-0 px-3 py-2 text-sm border dark:border-slate-700 rounded-lg dark:bg-slate-900 outline-none focus:border-indigo-500 dark:text-white" />
                    <div class="flex gap-1 items-center bg-gray-50 dark:bg-slate-800 p-1 rounded-lg border dark:border-slate-700 shrink-0">
                        <span class="text-[10px] uppercase font-bold text-gray-400 px-2">DL:</span>
                        <input type="date" name="deadline" required class="w-32 px-2 py-1.5 text-xs bg-transparent outline-none dark:text-white" title="Deadline" />
                    </div>
                    <input type="url" name="linkSumber" placeholder="Link Info..." class="w-28 shrink-0 px-3 py-2 text-sm border dark:border-slate-700 rounded-lg dark:bg-slate-900 outline-none focus:border-indigo-500 dark:text-white" title="URL Info Lomba" />
                    <input type="url" name="linkPengumpulan" placeholder="Link Kumpul..." class="w-28 shrink-0 px-3 py-2 text-sm border dark:border-slate-700 rounded-lg dark:bg-slate-900 outline-none focus:border-indigo-500 dark:text-white" title="URL Pengumpulan" />
                `;
            }
            
            return `
                <form onsubmit="addTask(event)" class="flex flex-wrap lg:flex-nowrap gap-2 mb-4 p-4 bg-gray-50/50 dark:bg-slate-900/50 border border-gray-100 dark:border-slate-700 rounded-xl items-center">
                    ${fields}
                    <button type="submit" class="px-4 py-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 font-bold text-sm shadow-sm flex items-center shrink-0"><i data-lucide="plus" class="w-4 h-4 mr-1"></i> Add</button>
                </form>
            `;
        }

        // --- RENDER TABEL (MENGUBAH URL MENJADI IKON LINK) ---
        function renderSpecificTable(type) {
            const filteredTasks = state.tasks.filter(t => t.categoryId === state.activeTab && t.subCategory === state.activeSub);
            
            let thead = '';
            let rows = '';

            const getProgresDropdown = (taskId, current) => `
                <select onchange="updateTaskProgress('${taskId}', this.value)" class="text-xs font-bold px-2 py-1 rounded outline-none border border-transparent hover:border-gray-300 dark:bg-slate-800 dark:text-white ${current === 'Selesai' ? 'text-emerald-600' : current === 'Proses' ? 'text-amber-600' : 'text-gray-500'}">
                    <option value="Belum" ${current === 'Belum' ? 'selected' : ''}>Belum</option>
                    <option value="Proses" ${current === 'Proses' ? 'selected' : ''}>Proses</option>
                    <option value="Selesai" ${current === 'Selesai' ? 'selected' : ''}>Selesai</option>
                </select>
            `;

            // Helper untuk me-render Link menjadi ikon eksternal (jika link ada)
            const getLinkHtml = (url) => url ? `<a href="${url}" target="_blank" class="text-indigo-500 hover:text-indigo-600 dark:hover:text-indigo-400 hover:underline flex justify-center"><i data-lucide="external-link" class="w-4 h-4"></i></a>` : '-';

            if(type === 'organisasi') {
                thead = `<tr><th class="px-4 py-3 w-12 text-center rounded-tl-xl">No</th><th class="px-4 py-3 w-32">Sie</th><th class="px-4 py-3">Keterangan</th><th class="px-4 py-3 w-32">Deadline</th><th class="px-4 py-3 w-24 text-center">Kumpul</th><th class="px-4 py-3 w-32 text-center">Progres</th><th class="px-4 py-3 w-12 rounded-tr-xl"></th></tr>`;
                rows = filteredTasks.map((t, i) => `
                    <tr class="border-b dark:border-slate-700 hover:bg-gray-50 dark:hover:bg-slate-800/50 transition-colors ${t.data.progres === 'Selesai' ? 'opacity-60' : ''}">
                        <td class="px-4 py-3 text-center text-xs font-bold text-gray-400">${i+1}</td>
                        <td class="px-4 py-3 text-sm font-bold text-gray-700 dark:text-gray-300">${t.data.sie}</td>
                        <td class="px-4 py-3 text-sm font-medium text-gray-800 dark:text-gray-200">${t.data.keterangan}</td>
                        <td class="px-4 py-3 text-xs font-semibold text-rose-500">${t.data.deadline ? t.data.deadline : '-'}</td>
                        <td class="px-4 py-3 text-center">${getLinkHtml(t.data.linkPengumpulan || t.data.pengumpulan)}</td>
                        <td class="px-4 py-3 text-center">${getProgresDropdown(t.id, t.data.progres)}</td>
                        <td class="px-4 py-3 text-right"><button onclick="deleteTask('${t.id}')" class="text-gray-400 hover:text-rose-500"><i data-lucide="trash-2" class="w-4 h-4"></i></button></td>
                    </tr>
                `).join('');
            } else if (type === 'kuliah') {
                thead = `<tr><th class="px-4 py-3 w-12 text-center rounded-tl-xl">No</th><th class="px-4 py-3 w-32">Bab</th><th class="px-4 py-3">Ngapain</th><th class="px-4 py-3 w-32">Deadline</th><th class="px-4 py-3 w-24 text-center">Kumpul</th><th class="px-4 py-3 w-32 text-center">Progres</th><th class="px-4 py-3 w-12 rounded-tr-xl"></th></tr>`;
                rows = filteredTasks.map((t, i) => `
                    <tr class="border-b dark:border-slate-700 hover:bg-gray-50 dark:hover:bg-slate-800/50 transition-colors ${t.data.progres === 'Selesai' ? 'opacity-60' : ''}">
                        <td class="px-4 py-3 text-center text-xs font-bold text-gray-400">${i+1}</td>
                        <td class="px-4 py-3 text-sm font-bold text-indigo-600 dark:text-indigo-400">${t.data.bab}</td>
                        <td class="px-4 py-3 text-sm font-medium text-gray-800 dark:text-gray-200">${t.data.ngapain}</td>
                        <td class="px-4 py-3 text-xs font-semibold text-rose-500">${t.data.deadline ? t.data.deadline : '-'}</td>
                        <td class="px-4 py-3 text-center">${getLinkHtml(t.data.linkPengumpulan || t.data.pengumpulan)}</td>
                        <td class="px-4 py-3 text-center">${getProgresDropdown(t.id, t.data.progres)}</td>
                        <td class="px-4 py-3 text-right"><button onclick="deleteTask('${t.id}')" class="text-gray-400 hover:text-rose-500"><i data-lucide="trash-2" class="w-4 h-4"></i></button></td>
                    </tr>
                `).join('');
            } else if (type === 'lomba') {
                thead = `<tr><th class="px-4 py-3 w-12 text-center rounded-tl-xl">No</th><th class="px-4 py-3">Nama Lomba</th><th class="px-4 py-3 w-24 text-center">Jenis</th><th class="px-4 py-3 w-32">Luaran</th><th class="px-4 py-3 w-32">Deadline</th><th class="px-4 py-3 w-20 text-center">Info</th><th class="px-4 py-3 w-20 text-center">Kumpul</th><th class="px-4 py-3 w-32 text-center">Progres</th><th class="px-4 py-3 w-12 rounded-tr-xl"></th></tr>`;
                rows = filteredTasks.map((t, i) => `
                    <tr class="border-b dark:border-slate-700 hover:bg-gray-50 dark:hover:bg-slate-800/50 transition-colors ${t.data.progres === 'Selesai' ? 'opacity-60' : ''}">
                        <td class="px-4 py-3 text-center text-xs font-bold text-gray-400">${i+1}</td>
                        <td class="px-4 py-3 text-sm font-bold text-amber-600 dark:text-amber-400">${t.data.namaLomba}</td>
                        <td class="px-4 py-3 text-center"><span class="px-2 py-1 text-[10px] font-bold uppercase rounded-md bg-gray-100 dark:bg-slate-700 text-gray-600 dark:text-gray-300">${t.data.jenis}</span></td>
                        <td class="px-4 py-3 text-sm font-medium text-gray-600 dark:text-gray-400">${t.data.luaran}</td>
                        <td class="px-4 py-3 text-xs font-semibold text-rose-500">${t.data.deadline || t.data.pengumpulan || '-'}</td>
                        <td class="px-4 py-3 text-center">${getLinkHtml(t.data.linkSumber)}</td>
                        <td class="px-4 py-3 text-center">${getLinkHtml(t.data.linkPengumpulan)}</td>
                        <td class="px-4 py-3 text-center">${getProgresDropdown(t.id, t.data.progres)}</td>
                        <td class="px-4 py-3 text-right"><button onclick="deleteTask('${t.id}')" class="text-gray-400 hover:text-rose-500"><i data-lucide="trash-2" class="w-4 h-4"></i></button></td>
                    </tr>
                `).join('');
            }

            if(filteredTasks.length === 0) rows = `<tr><td colspan="10" class="px-4 py-8 text-center text-gray-400 text-sm"><i data-lucide="inbox" class="w-8 h-8 mx-auto mb-2 opacity-30"></i> Belum ada data di tabel ini.</td></tr>`;

            return `
                <div class="overflow-x-auto border border-gray-200 dark:border-slate-700 rounded-xl bg-white dark:bg-slate-800/50 shadow-sm custom-scrollbar">
                    <table class="w-full text-left text-gray-500 dark:text-gray-400">
                        <thead class="text-[11px] text-gray-700 uppercase bg-gray-50 dark:bg-slate-700/50 dark:text-gray-300 border-b border-gray-200 dark:border-slate-700">
                            ${thead}
                        </thead>
                        <tbody>${rows}</tbody>
                    </table>
                </div>
            `;
        }

        // --- DASHBOARD ---
        function renderDashboard() {
            const today = new Date();
            today.setHours(0,0,0,0);
            const next3Days = new Date(today);
            next3Days.setDate(today.getDate() + 3);

            const mapTaskForDash = (t) => {
                let title = '', date = '';
                if(t.type === 'organisasi') { title = t.data.keterangan; date = t.data.deadline; }
                else if(t.type === 'kuliah') { title = t.data.ngapain; date = t.data.deadline; }
                else if(t.type === 'lomba') { title = t.data.namaLomba; date = t.data.deadline || t.data.pengumpulan; } // Kompatibel dgn data lama
                return { ...t, dashTitle: title, dashDate: date };
            };

            const mappedTasks = state.tasks.map(mapTaskForDash);

            const urgentTasks = mappedTasks.filter(t => {
                if (t.data.progres === 'Selesai' || !t.dashDate) return false;
                const due = new Date(t.dashDate);
                due.setHours(0,0,0,0);
                return due <= next3Days;
            }).sort((a, b) => new Date(a.dashDate) - new Date(b.dashDate));

            let urgentHtml = urgentTasks.length === 0 
                ? `<p class="text-sm font-medium text-rose-600/70 dark:text-rose-400/70">Aman, tidak ada deadline mendesak.</p>`
                : urgentTasks.map(task => `
                    <div class="bg-white/90 dark:bg-slate-900/90 p-4 rounded-xl shadow-sm border border-rose-100/50 dark:border-rose-900/30">
                        <div class="flex flex-wrap items-center gap-2 mb-2">
                            <span class="text-[9px] font-black uppercase tracking-wider px-2 py-1 rounded-md bg-gray-100 dark:bg-slate-800 text-gray-600 dark:text-gray-300 truncate max-w-[100px]">${state.categories.find(c=>c.id === task.categoryId)?.name || ''}</span>
                            <span class="text-[9px] font-bold px-2 py-1 rounded-md border border-gray-200 dark:border-slate-700 text-gray-500 dark:text-gray-400 truncate max-w-[100px]">${task.subCategory || '-'}</span>
                        </div>
                        <p class="text-sm text-gray-800 dark:text-gray-200 font-bold truncate mb-2" title="${task.dashTitle}">${task.dashTitle}</p>
                        <span class="text-xs font-bold text-rose-600 dark:text-rose-400 flex items-center"><i data-lucide="clock" class="w-3 h-3 mr-1"></i> ${new Date(task.dashDate).toLocaleDateString('id-ID', {day: 'numeric', month: 'short'})}</span>
                    </div>
                `).join('');

            // KALENDER GENERATOR
            let calendarHtml = '';
            const numDays = state.calendarView === 'mingguan' ? 7 : 28;
            for (let i = 0; i < numDays; i++) {
                const date = new Date(today);
                date.setDate(today.getDate() + i);
                const dateString = date.toISOString().split('T')[0];
                
                const dayTasks = mappedTasks.filter(t => t.dashDate === dateString && t.data.progres !== 'Selesai');
                
                const isToday = i === 0;
                calendarHtml += `
                    <div class="p-3 rounded-xl border flex flex-col ${isToday ? 'bg-indigo-50 dark:bg-indigo-900/10 border-indigo-200 dark:border-indigo-800/50 shadow-sm' : 'bg-white dark:bg-slate-800/40 border-gray-100 dark:border-slate-700/50'}">
                        <div class="text-[11px] font-bold mb-3 flex items-center justify-between ${isToday ? 'text-indigo-700 dark:text-indigo-400' : 'text-gray-500 dark:text-gray-400'}">
                            <span>${date.toLocaleDateString('id-ID', { weekday: 'short', day: 'numeric', month: 'short' })}</span>
                            ${isToday ? '<span class="px-1.5 py-0.5 bg-indigo-100 dark:bg-indigo-800/50 rounded text-[9px] uppercase">Hari Ini</span>' : ''}
                        </div>
                        <div class="space-y-1.5 flex-1">
                            ${dayTasks.map(t => `
                                <div class="text-[10px] px-2 py-1.5 bg-gray-50 dark:bg-slate-900 rounded-md text-gray-700 dark:text-gray-300 truncate border-l-2 border-indigo-500 font-medium" title="[${t.subCategory}]${t.dashTitle}">
                                    ${t.dashTitle}
                                </div>
                            `).join('')}
                            ${dayTasks.length === 0 ? '<div class="text-[10px] text-gray-300 dark:text-gray-600 italic">Kosong</div>' : ''}
                        </div>
                    </div>
                `;
            }

            return `
                <div class="flex flex-col gap-6 h-full fade-in">
                    <div class="bg-gradient-to-br from-rose-50 to-orange-50 dark:from-rose-950/20 dark:to-orange-950/20 rounded-2xl border border-rose-100 dark:border-rose-900/30 p-5 md:p-6 shrink-0">
                        <h3 class="text-base md:text-lg font-bold mb-4 text-rose-700 dark:text-rose-400 flex items-center"><i data-lucide="alert-triangle" class="w-5 h-5 mr-2"></i> TUGAS URGENT (H-3)</h3>
                        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4">${urgentHtml}</div>
                    </div>
                    <div class="bg-white dark:bg-slate-800/50 rounded-2xl border border-gray-100 dark:border-slate-700/50 p-5 md:p-6 flex-1 flex flex-col min-h-[400px]">
                        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-6 gap-4">
                            <h3 class="text-base md:text-lg font-bold text-gray-800 dark:text-white flex items-center"><i data-lucide="calendar-days" class="w-5 h-5 mr-2 text-indigo-500"></i> Lini Masa Harian</h3>
                            <div class="flex bg-gray-100 dark:bg-slate-900 p-1 rounded-xl">
                                <button onclick="switchCalendarView('mingguan')" class="px-4 py-1.5 text-xs font-bold rounded-lg transition-all ${state.calendarView === 'mingguan' ? 'bg-white dark:bg-slate-700 shadow-sm text-indigo-600 dark:text-indigo-400' : 'text-gray-500 hover:text-gray-700 dark:text-gray-400'}">Mingguan</button>
                                <button onclick="switchCalendarView('bulanan')" class="px-4 py-1.5 text-xs font-bold rounded-lg transition-all ${state.calendarView === 'bulanan' ? 'bg-white dark:bg-slate-700 shadow-sm text-indigo-600 dark:text-indigo-400' : 'text-gray-500 hover:text-gray-700 dark:text-gray-400'}">Bulanan</button>
                            </div>
                        </div>
                        <div class="flex-1 overflow-hidden flex flex-col">
                            <div class="grid gap-3 overflow-y-auto p-1 h-full content-start ${state.calendarView === 'mingguan' ? 'grid-cols-2 sm:grid-cols-3 md:grid-cols-7' : 'grid-cols-2 sm:grid-cols-4 md:grid-cols-7'}">
                                ${calendarHtml}
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        // --- RENDER NOTULENSI ---
        function renderNotesPanel() {
            if (state.editingNoteId !== null) {
                let note = { title: '', date: new Date().toISOString().split('T')[0], content: '' };
                if (state.editingNoteId !== 'new') note = state.notesList.find(n => n.id === state.editingNoteId) || note;
                
                return `
                    <div class="flex flex-col h-full bg-white dark:bg-slate-800/50 rounded-2xl border border-gray-100 dark:border-slate-700/50 shadow-sm overflow-hidden fade-in">
                        <div class="p-4 border-b border-gray-100 dark:border-slate-700/50 flex justify-between items-center bg-gray-50/50 dark:bg-slate-900/30">
                            <h3 class="font-bold flex items-center"><i data-lucide="edit-3" class="w-4 h-4 mr-2 text-indigo-500"></i> Editor Notulensi</h3>
                            <div class="flex gap-2">
                                <button onclick="closeNoteForm()" class="px-3 py-1.5 text-xs font-bold rounded-lg text-gray-500 hover:bg-gray-200 dark:hover:bg-slate-700">Batal</button>
                                <button onclick="document.getElementById('form-note').requestSubmit()" class="px-4 py-1.5 text-xs font-bold rounded-lg bg-indigo-600 text-white hover:bg-indigo-700">Simpan</button>
                            </div>
                        </div>
                        <form id="form-note" onsubmit="saveNoteForm(event)" class="p-4 flex-1 flex flex-col gap-4 overflow-y-auto">
                            <div class="flex gap-4">
                                <input type="text" id="note-title" required value="${note.title}" placeholder="Judul Rapat / Catatan..." class="flex-1 px-4 py-2 text-sm font-semibold bg-gray-50 dark:bg-slate-900 border border-gray-200 dark:border-slate-700 rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none dark:text-white" />
                                <input type="date" id="note-date" required value="${note.date}" class="w-40 px-4 py-2 text-sm bg-gray-50 dark:bg-slate-900 border border-gray-200 dark:border-slate-700 rounded-xl outline-none dark:text-white" />
                            </div>
                            <textarea id="note-content" required placeholder="Tulis notulensi di sini..." class="flex-1 w-full p-4 text-sm bg-gray-50/50 dark:bg-slate-900/50 border border-gray-200 dark:border-slate-700 rounded-xl resize-none focus:ring-2 focus:ring-indigo-500 outline-none dark:text-gray-200 min-h-[150px]">${note.content}</textarea>
                        </form>
                    </div>
                `;
            }

            const filteredNotes = state.notesList.filter(n => n.categoryId === state.activeTab && n.subCategory === state.activeSub);
            let notesHtml = filteredNotes.length === 0 
                ? `<div class="flex-1 flex flex-col items-center justify-center text-gray-400 mt-6"><i data-lucide="file-text" class="w-8 h-8 mb-2 opacity-20"></i><p class="text-xs">Belum ada notulensi.</p></div>`
                : `<div class="grid gap-3 overflow-y-auto pr-2 custom-scrollbar">` + 
                  filteredNotes.sort((a,b) => new Date(b.date) - new Date(a.date)).map(note => `
                    <div class="group bg-white dark:bg-slate-800 border border-gray-100 dark:border-slate-700 rounded-xl p-3 hover:border-indigo-300 transition-all cursor-pointer shadow-sm flex justify-between items-start" onclick="editNote('${note.id}')">
                        <div>
                            <h4 class="text-sm font-bold text-gray-800 dark:text-gray-100 mb-1 group-hover:text-indigo-600">${note.title}</h4>
                            <p class="text-[10px] text-gray-500 flex items-center"><i data-lucide="calendar" class="w-3 h-3 mr-1"></i> ${new Date(note.date).toLocaleDateString('id-ID', {day:'numeric', month:'short'})}</p>
                        </div>
                        <button onclick="event.stopPropagation(); deleteNoteItem('${note.id}')" class="p-1.5 text-gray-400 hover:text-rose-500"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                    </div>
                  `).join('') + `</div>`;

            return `
                <div class="bg-white dark:bg-slate-800/50 rounded-2xl border border-gray-100 dark:border-slate-700/50 p-5 flex flex-col shadow-sm h-full max-h-[80vh]">
                    <div class="flex justify-between items-center mb-4">
                        <h3 class="text-sm font-bold flex items-center"><i data-lucide="files" class="w-4 h-4 mr-2 text-indigo-500"></i> Notulensi</h3>
                        <button onclick="openNewNoteForm()" class="px-3 py-1.5 bg-indigo-50 text-indigo-700 dark:bg-indigo-500/10 dark:text-indigo-400 text-[10px] font-bold rounded-lg hover:bg-indigo-100 flex items-center"><i data-lucide="plus" class="w-3 h-3 mr-1"></i> Baru</button>
                    </div>
                    ${notesHtml}
                </div>
            `;
        }

        // --- RENDER HALAMAN UTAMA ---
        function renderCategoryBoard() {
            const catObj = getActiveCategoryObj();
            if(!state.activeSub) {
                return `
                    ${renderSubCategoriesPills()}
                    <div class="flex-1 flex flex-col items-center justify-center mt-20 text-gray-400 fade-in">
                        <i data-lucide="folder-open" class="w-16 h-16 mb-4 opacity-20"></i>
                        <p>Silakan buat atau pilih Sub-Kategori di atas terlebih dahulu.</p>
                    </div>
                `;
            }

            return `
                <div class="flex flex-col h-full fade-in">
                    ${renderSubCategoriesPills()}
                    <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 flex-1 min-h-0">
                        <!-- Panel Tabel Utama -->
                        <div class="lg:col-span-8 bg-white dark:bg-slate-800/20 rounded-2xl border border-transparent p-1 flex flex-col h-full max-h-[85vh]">
                            ${renderSpecificForm(catObj.type)}
                            ${renderSpecificTable(catObj.type)}
                        </div>
                        <!-- Panel Kanan (Notulensi) -->
                        <div class="lg:col-span-4 h-full">
                            ${renderNotesPanel()}
                        </div>
                    </div>
                </div>
            `;
        }

        function renderWorkspace() {
            const workspace = document.getElementById('workspace');
            if (state.activeTab === 'dashboard') workspace.innerHTML = renderDashboard();
            else workspace.innerHTML = renderCategoryBoard();
            lucide.createIcons();
        }

        // INIT APP
        window.onload = () => {
            syncTheme(); 
            renderNavigation();
            renderHeader();
            renderWorkspace();
        };
    </script>
</body>
</html>
